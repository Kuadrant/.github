name: Test Contributor Governance

on:
  pull_request:
    paths:
      - .github/workflows/contributor-governance.yml
      - .github/workflows/test-contributor-governance.yml
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/contributor-governance.yml
      - .github/workflows/test-contributor-governance.yml
      - tests/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.mjs
